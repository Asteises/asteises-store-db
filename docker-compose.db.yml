services:
  bootlegbricks-db:
    image: bootlegbricks-postgres:18-init
    build:
      context: .
      dockerfile: Dockerfile.pg
    container_name: bootlegbricks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - bootlegbricks_pgdata:/var/lib/postgresql/data
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bootlegbricks-network

volumes:
  bootlegbricks_pgdata:
    name: bootlegbricks_pgdata

networks:
  bootlegbricks-network:
    external: true